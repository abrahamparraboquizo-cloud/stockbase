<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StockBase" />
  <title>StockBase</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #F2EFE9; --white: #fff; --accent: #D4522A; --accent-light: #FAE9E4;
      --border: #E0DDD6; --text: #1A1A1A; --muted: #8A8A8A; --success: #4CAF50;
    }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', system-ui, sans-serif; color: var(--text); overflow: hidden; }
    #app { max-width: 430px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

    .header { background: var(--white); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 24px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); font-style: italic; }
    .status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 100px; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }

    .image-zone { width: 100%; height: 200px; border-radius: 16px; border: 2px dashed var(--border); background: #ECEAE4; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; margin-bottom: 20px; }
    .image-zone img { width: 100%; height: 100%; object-fit: cover; }
    .image-placeholder { text-align: center; color: var(--muted); }
    .image-placeholder .icon { font-size: 40px; margin-bottom: 8px; }
    .image-placeholder p { font-size: 13px; font-weight: 500; }
    .image-placeholder small { font-size: 11px; display: block; margin-top: 3px; opacity: 0.7; }
    .scan-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; }
    .scan-overlay p { font-size: 13px; font-weight: 600; }

    .spinner { width: 24px; height: 24px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .spinner-dark { width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
    .badge.ok  { background: #E8F5E9; color: #2E7D32; }
    .badge.err { background: var(--accent-light); color: #C62828; }

    .alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; display: flex; gap: 8px; line-height: 1.5; }
    .alert.error { background: #FDE8E4; border: 1px solid #F4C5BB; color: #C62828; }
    .alert.warn  { background: #FFF8E1; border: 1px solid #FFECB3; color: #E65100; }

    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-group { flex: 1; margin-bottom: 14px; }
    .form-group.half { flex: 1; margin-bottom: 0; }
    label.field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 7px; }

    input, select, textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--white); font-size: 14px; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: none; line-height: 1.5; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

    .btn-add { width: 100%; margin-top: 8px; padding: 17px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.2s; }
    .btn-add:active { transform: scale(0.98); }
    .btn-add:disabled { background: #C5C0B7; cursor: not-allowed; }

    .bottom-nav { background: var(--white); border-top: 1px solid var(--border); padding: 10px 0 env(safe-area-inset-bottom, 10px); display: flex; flex-shrink: 0; }
    .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.8px; font-family: inherit; cursor: pointer; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn .nav-icon { font-size: 22px; }

    .inv-card { background: var(--white); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--border); display: flex; gap: 12px; align-items: center; margin-bottom: 10px; animation: fadeIn 0.25s ease; }
    .inv-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .inv-thumb-placeholder { width: 60px; height: 60px; border-radius: 10px; background: #ECEAE4; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .inv-color { font-size: 11px; color: #ABABAB; margin-top: 2px; }
    .inv-delete { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.5; padding: 4px; flex-shrink: 0; }

    .stats-grid { display: flex; gap: 12px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: var(--white); border-radius: 14px; padding: 16px 10px; border: 1px solid var(--border); text-align: center; }
    .stat-icon { font-size: 26px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: var(--muted); }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .e-icon { font-size: 50px; margin-bottom: 14px; }
    .empty p { font-size: 14px; }
    .empty small { font-size: 12px; display: block; margin-top: 5px; opacity: 0.7; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; opacity: 0.6; padding: 2px 4px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .view { animation: fadeIn 0.25s ease; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// ─────────────────────────────────────────────
//  CONFIGURACIÓN — clave guardada en localStorage
//  Nunca en el código → nunca en GitHub
// ─────────────────────────────────────────────
const DB_URL = 'https://inventario-c0ab6-default-rtdb.europe-west1.firebasedatabase.app';
function getKey() { return localStorage.getItem('sb_gemini_key') || ''; }

const CATEGORIES = ['Zapatillas','Botas','Sandalias','Mocasines','Deportivas','Otro'];

let state = {
  view:      'scan',
  geminiKey: getKey(),
  form:      emptyForm(),
  imageURL:  null,
  loading:   false,
  saving:    false,
  aiStatus:  null,
  inventory: [],
  fbLoading: true,
  fbError:   null,
};

function emptyForm() {
  return { marca:'', modelo:'', categoria:'Zapatillas', talla:'', color:'', cantidad:1, precio:'', notas:'' };
}

// ══════════════════════════════════════════════
//  FIREBASE REST API
// ══════════════════════════════════════════════
async function fbLoad() {
  try {
    const res  = await fetch(`${DB_URL}/stockbase.json`);
    const data = await res.json();
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (!data) return [];
    return Object.entries(data)
      .map(([key, val]) => ({ ...val, _key: key }))
      .sort((a, b) => (b.id || 0) - (a.id || 0));
  } catch(e) {
    console.error('[Firebase] Error:', e);
    state.fbError = e.message;
    return [];
  }
}

async function fbAdd(item) {
  const res = await fetch(`${DB_URL}/stockbase.json`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(item),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function fbDelete(key) {
  const res = await fetch(`${DB_URL}/stockbase/${key}.json`, { method: 'DELETE' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

async function refreshInventory() {
  state.fbLoading = true;
  state.fbError   = null;
  render();
  state.inventory = await fbLoad();
  state.fbLoading = false;
  render();
}

// Comprimir imagen a ~50KB para Firebase
function compressImage(objectURL) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX = 320;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
      else        { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', 0.65));
    };
    img.onerror = () => resolve(null);
    img.src = objectURL;
  });
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!state.geminiKey) { app.innerHTML = renderGeminiSetup(); bindGeminiSetup(); return; }
  app.innerHTML = `
    ${renderHeader()}
    <div class="content">${
      state.view === 'scan'      ? renderScan()      :
      state.view === 'inventory' ? renderInventory() :
                                   renderStats()
    }</div>
    ${renderNav()}
  `;
  bindEvents();

  // ── FIX SAFARI iOS ──────────────────────────────────────────
  // Safari ignora el atributo value="" cuando se reconstruye el DOM
  // con innerHTML. Forzamos los valores programáticamente.
  if (state.view === 'scan') {
    requestAnimationFrame(() => {
      const f = state.form;
      const set = (id, val) => {
        const el = document.getElementById(id);
        if (el && val !== undefined && val !== null) el.value = val;
      };
      set('f-marca',  f.marca);
      set('f-modelo', f.modelo);
      set('f-cat',    f.categoria);
      set('f-talla',  f.talla);
      set('f-color',  f.color);
      set('f-qty',    f.cantidad);
      set('f-precio', f.precio);
      set('f-notas',  f.notas);
      // Habilitar botón si hay marca
      const btn = document.getElementById('btn-add');
      if (btn) btn.disabled = !f.marca || state.saving;
    });
  }
}

// ── Pantalla: introducir clave Gemini ──────────────────────────
function renderGeminiSetup() {
  return `
  <div style="max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;height:100%;overflow-y:auto">
      <div style="font-family:'DM Serif Display',serif;font-size:36px;margin-bottom:6px">Stock<span style="color:var(--accent);font-style:italic">Base</span></div>
      <div style="display:inline-block;background:#E8F5E9;color:#2E7D32;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:20px">✅ 100% Gratuito</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6">Introduce tu API Key de Google Gemini para activar la lectura automática de etiquetas con IA.</p>
      <label class="field-label" style="align-self:flex-start">API KEY DE GOOGLE GEMINI</label>
      <input type="password" id="key-input" placeholder="AIza…" autocomplete="off" style="margin-bottom:14px" />
      <button class="btn-add" id="key-save">ACTIVAR STOCKBASE</button>
      <p style="font-size:11px;color:var(--muted);margin-top:16px;line-height:1.8">
        Obtén tu clave gratis en<br>
        <a href="https://aistudio.google.com" target="_blank" style="color:var(--accent)">aistudio.google.com</a> → Get API Key<br>
        La clave se guarda <strong>solo en este dispositivo</strong>.<br>
        Nunca se sube a ningún servidor.
      </p>
    </div>
  </div>`;
}

function bindGeminiSetup() {
  const save = () => {
    const val = document.getElementById('key-input').value.trim();
    if (!val) return;
    state.geminiKey = val;
    localStorage.setItem('sb_gemini_key', val);
    render();
  };
  document.getElementById('key-save').addEventListener('click', save);
  document.getElementById('key-input').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
}

// ── Header ─────────────────────────────────────────────────────
function renderHeader() {
  const dotColor = state.fbError ? '#C62828' : '#4CAF50';
  const label    = state.fbLoading ? '⏳ Cargando…' : state.fbError ? '❌ Error DB' : 'Firebase · Sync';
  return `
  <div class="header">
    <div class="logo">Stock<span>Base</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="status-dot">
        <div class="dot" style="background:${dotColor}"></div>${label}
      </div>
      <span style="font-size:10px;color:var(--muted);font-weight:700">v7</span>
      <button class="icon-btn" id="btn-refresh" title="Recargar">🔄</button>
      <button class="icon-btn" id="btn-settings" title="Cambiar clave">⚙️</button>
    </div>
  </div>`;
}

// ── Nav ────────────────────────────────────────────────────────
function renderNav() {
  return `
  <div class="bottom-nav">
    ${[['scan','📷','ESCANEAR'],['inventory','📦','INVENTARIO'],['stats','📊','STATS']].map(([id,icon,label]) => `
      <button class="nav-btn ${state.view===id?'active':''}" data-view="${id}">
        <span class="nav-icon">${icon}</span>${label}
      </button>`).join('')}
  </div>`;
}

// ── Vista: Escanear ────────────────────────────────────────────
function renderScan() {
  const f = state.form;

  const badge = state.aiStatus === 'ok'
    ? `<span class="badge ok">✨ Leído por IA</span>`
    : state.aiStatus === 'error'
    ? `<span class="badge err">⚠ Manual</span>` : '';

  const errorAlert = state.aiStatus === 'error'
    ? `<div class="alert error">⚠️ Gemini falló.<br><small style="display:block;margin-top:6px;font-family:monospace;word-break:break-all">${esc(state.aiError||'Ver consola')}</small></div>` : '';

  const imgContent = state.imageURL
    ? `<img src="${state.imageURL}" alt="etiqueta" />
       ${state.loading ? `<div class="scan-overlay"><div class="spinner"></div><p>Leyendo con Gemini IA…</p></div>` : ''}`
    : `<div class="image-placeholder">
         <div class="icon">📷</div>
         <p>Toca para fotografiar la etiqueta</p>
         <small>Gemini leerá los datos automáticamente</small>
       </div>`;

  // Nota: los value="" se sobreescriben por requestAnimationFrame después del render
  return `
  <div class="view">
    <div class="section-title">NUEVO ARTÍCULO ${badge}</div>
    <div class="image-zone" id="image-zone">${imgContent}</div>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" />
    ${errorAlert}
    <div class="form-row">
      <div class="form-group half">
        <label class="field-label">MARCA *</label>
        <input type="text" id="f-marca" placeholder="Nike, Veja…" autocomplete="off" />
      </div>
      <div class="form-group half">
        <label class="field-label">MODELO</label>
        <input type="text" id="f-modelo" placeholder="Air Max, Campo…" autocomplete="off" />
      </div>
    </div>
    <div class="form-group">
      <label class="field-label">CATEGORÍA</label>
      <div class="select-wrap">
        <select id="f-cat">${CATEGORIES.map(c => `<option>${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group half">
        <label class="field-label">TALLA</label>
        <input type="text" id="f-talla" placeholder="EUR 40" autocomplete="off" />
      </div>
      <div class="form-group half">
        <label class="field-label">COLOR</label>
        <input type="text" id="f-color" placeholder="Blanco…" autocomplete="off" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group half">
        <label class="field-label">CANTIDAD</label>
        <input type="number" id="f-qty" min="1" value="1" />
      </div>
      <div class="form-group half">
        <label class="field-label">PRECIO (€)</label>
        <input type="number" id="f-precio" placeholder="0.00" />
      </div>
    </div>
    <div class="form-group">
      <label class="field-label">NOTAS</label>
      <textarea id="f-notas" rows="2" placeholder="Referencia, material, país…"></textarea>
    </div>
    <button class="btn-add" id="btn-add" disabled>
      ${state.saving ? '⏳ Guardando…' : '+ AÑADIR AL INVENTARIO'}
    </button>
  </div>`;
}

// ── Vista: Inventario ──────────────────────────────────────────
function renderInventory() {
  if (state.fbLoading) return `
    <div class="view">
      <div class="section-title">INVENTARIO</div>
      <div class="empty"><div class="spinner-dark"></div><p>Cargando desde Firebase…</p></div>
    </div>`;
  if (state.fbError) return `
    <div class="view">
      <div class="section-title">INVENTARIO</div>
      <div class="alert error">❌ Error: ${esc(state.fbError)}<br><small>Verifica las reglas de Realtime Database.</small></div>
    </div>`;
  const items = state.inventory;
  if (!items.length) return `
    <div class="view">
      <div class="section-title">INVENTARIO</div>
      <div class="empty"><div class="e-icon">📦</div><p>Sin artículos todavía</p><small>Escanea tu primera etiqueta</small></div>
    </div>`;
  return `
  <div class="view">
    <div class="section-title">INVENTARIO <span style="color:var(--accent)">${items.length}</span></div>
    ${items.map(item => `
      <div class="inv-card">
        ${item.imagen
          ? `<img class="inv-thumb" src="${item.imagen}" onerror="this.style.display='none'" />`
          : `<div class="inv-thumb-placeholder">👟</div>`}
        <div class="inv-info">
          <div class="inv-name">${esc(item.marca)} ${esc(item.modelo)}</div>
          <div class="inv-meta">${esc(item.categoria)} · T ${esc(item.talla)} · ×${item.cantidad}${item.precio?' · €'+item.precio:''}</div>
          ${item.color?`<div class="inv-color">${esc(item.color)}</div>`:''}
        </div>
        <button class="inv-delete" data-key="${esc(item._key)}">🗑</button>
      </div>`).join('')}
  </div>`;
}

// ── Vista: Estadísticas ────────────────────────────────────────
function renderStats() {
  const inv   = state.inventory;
  const total = inv.reduce((s,i)=>s+Number(i.cantidad||0),0);
  const brands= new Set(inv.map(i=>i.marca).filter(Boolean)).size;
  const cats  = inv.reduce((acc,i)=>{acc[i.categoria]=(acc[i.categoria]||0)+1;return acc;},{});
  const topCat= Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const valor = inv.reduce((s,i)=>s+(Number(i.precio||0)*Number(i.cantidad||0)),0);
  return `
  <div class="view">
    <div class="section-title">ESTADÍSTICAS</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value">${total}</div><div class="stat-label">UNIDADES</div></div>
      <div class="stat-card"><div class="stat-icon">🏷</div><div class="stat-value">${brands}</div><div class="stat-label">MARCAS</div></div>
      <div class="stat-card"><div class="stat-icon">👟</div><div class="stat-value">${inv.length}</div><div class="stat-label">MODELOS</div></div>
    </div>
    ${valor>0?`<div class="stat-card" style="margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;padding:16px 20px"><div><div class="stat-label">VALOR TOTAL</div><div class="stat-value" style="font-size:32px">€${valor.toFixed(0)}</div></div><div style="font-size:40px">💰</div></div>`:''}
    ${topCat?`<div class="stat-card" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px"><div><div class="stat-label">CATEGORÍA TOP</div><div style="font-size:18px;font-weight:700;margin-top:4px">${topCat[0]}</div></div><div style="font-size:36px">🥇</div></div>`:''}
    ${!inv.length?`<div class="empty"><div class="e-icon">📊</div><p>Añade artículos para ver estadísticas</p></div>`:''}
  </div>`;
}

// ══════════════════════════════════════════════
//  EVENTOS
// ══════════════════════════════════════════════
function bindEvents() {
  document.querySelectorAll('.nav-btn').forEach(btn =>
    btn.addEventListener('click', () => {
      const v = btn.dataset.view;
      state.view = v;
      if (v === 'inventory' || v === 'stats') refreshInventory();
      else render();
    })
  );

  const btnRefresh = document.getElementById('btn-refresh');
  if (btnRefresh) btnRefresh.addEventListener('click', refreshInventory);

  const btnSettings = document.getElementById('btn-settings');
  if (btnSettings) btnSettings.addEventListener('click', () => {
    if (confirm('¿Cambiar la API Key de Gemini?')) {
      state.geminiKey = ''; localStorage.removeItem('sb_gemini_key'); render();
    }
  });

  document.querySelectorAll('.inv-delete').forEach(btn =>
    btn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar este artículo?')) return;
      try { await fbDelete(btn.dataset.key); await refreshInventory(); }
      catch(e) { alert('Error al eliminar: ' + e.message); }
    })
  );

  if (state.view !== 'scan') return;

  const zone = document.getElementById('image-zone');
  if (zone) zone.addEventListener('click', () => {
    if (!state.loading && !state.saving) document.getElementById('file-input').click();
  });

  const fi = document.getElementById('file-input');
  if (fi) fi.addEventListener('change', handleFile);

  // Sincronizar state.form con los inputs al escribir
  ['marca','modelo','talla','color','notas'].forEach(k => {
    const el = document.getElementById('f-' + k);
    if (!el) return;
    el.addEventListener('input', () => {
      state.form[k] = el.value;
      const btn = document.getElementById('btn-add');
      if (btn) btn.disabled = !state.form.marca || state.saving;
    });
  });
  [['f-cat','categoria'],['f-qty','cantidad'],['f-precio','precio']].forEach(([id,key]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', () => { state.form[key] = el.value; });
  });

  const btnAdd = document.getElementById('btn-add');
  if (btnAdd) btnAdd.addEventListener('click', async () => {
    if (!state.form.marca || state.saving) return;
    state.saving = true;
    render();
    try {
      const imagen = state.imageURL ? await compressImage(state.imageURL) : null;
      await fbAdd({
        ...state.form,
        cantidad: Number(state.form.cantidad) || 1,
        precio:   state.form.precio !== '' ? Number(state.form.precio) : '',
        id:       Date.now(),
        imagen:   imagen || null,
      });
      state.form     = emptyForm();
      state.imageURL = null;
      state.aiStatus = null;
      state.saving   = false;
      state.view     = 'inventory';
      await refreshInventory();
    } catch(e) {
      console.error('[Firebase] Error guardando:', e);
      alert('Error al guardar: ' + e.message);
      state.saving = false;
      render();
    }
  });
}

// ══════════════════════════════════════════════
//  GEMINI
// ══════════════════════════════════════════════
function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  state.imageURL = URL.createObjectURL(file);
  state.aiStatus = null;
  state.aiError  = null;
  state.form     = emptyForm();
  state.loading  = true;
  render();

  const reader = new FileReader();
  reader.onload = ev => {
    readWithGemini(ev.target.result.split(',')[1], file.type || 'image/jpeg');
  };
  reader.readAsDataURL(file);
}

async function readWithGemini(b64, mimeType) {
  const MODELS = [
    'gemini-2.0-flash',
    'gemini-1.5-flash',
    'gemini-2.0-flash-lite',
  ];

  const PROMPT = `Look at this shoe box label image and extract the product information.
Return ONLY a JSON object with these exact keys (empty string "" if not found):
{
  "marca": "brand (e.g. Nike, Adidas, Veja, New Balance)",
  "modelo": "model name (e.g. Air Max 90, Court Royale, Campo)",
  "categoria": "one of exactly: Zapatillas, Botas, Sandalias, Mocasines, Deportivas, Otro",
  "talla": "EU size as string (e.g. 40, 42.5)",
  "color": "color (e.g. Black/White, Negro/Blanco)",
  "notas": "any reference code, SKU, country of origin, material"
}
Output ONLY the JSON. No markdown. No explanation. No extra text.`;

  const errors = [];

  for (const model of MODELS) {
    for (const ver of ['v1beta', 'v1']) {
      try {
        console.log(`[Gemini] Probando: ${model} (${ver})`);
        const res = await fetch(
          `https://generativelanguage.googleapis.com/${ver}/models/${model}:generateContent?key=${state.geminiKey}`,
          {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [
                { inline_data: { mime_type: mimeType, data: b64 } },
                { text: PROMPT }
              ]}],
              generationConfig: { temperature: 0.1, maxOutputTokens: 512 }
            })
          }
        );

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const msg = `${model}/${ver} → ${res.status}: ${err?.error?.message || ''}`.substring(0, 120);
          console.warn('[Gemini]', msg);
          errors.push(msg);
          continue;
        }

        const data = await res.json();
        const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (!raw) { errors.push(`${model}/${ver} → vacío`); continue; }

        const clean = raw.replace(/^```json\s*/i,'').replace(/^```/,'').replace(/```$/,'').trim();
        const p = JSON.parse(clean);
        state.form.marca     = String(p.marca     || '').trim();
        state.form.modelo    = String(p.modelo    || '').trim();
        state.form.categoria = CATEGORIES.includes(p.categoria) ? p.categoria : 'Zapatillas';
        state.form.talla     = String(p.talla     || '').trim();
        state.form.color     = String(p.color     || '').trim();
        state.form.notas     = String(p.notas     || '').trim();

        console.log('[Gemini] ✅', model, ver, state.form);
        state.aiStatus = 'ok';
        state.loading  = false;
        render();
        return;

      } catch(err) {
        const msg = `${model}/${ver} → ${err.message}`.substring(0, 120);
        console.warn('[Gemini] Excepción:', msg);
        errors.push(msg);
      }
    }
  }

  state.aiError = errors.join('\n');

  console.error('[Gemini] ❌ Todos los modelos fallaron');
  state.aiStatus = 'error';
  state.loading  = false;
  render();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Arranque ───────────────────────────────────────────────────
refreshInventory();
</script>
