<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StockBase" />
  <title>StockBase</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #F2EFE9; --white: #fff; --accent: #D4522A; --accent-light: #FAE9E4;
      --border: #E0DDD6; --text: #1A1A1A; --muted: #8A8A8A; --success: #4CAF50;
    }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', system-ui, sans-serif; color: var(--text); overflow: hidden; }
    #app { max-width: 430px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

    .header { background: var(--white); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 24px; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); font-style: italic; }
    .status-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 16px 100px; }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }

    .image-zone { width: 100%; height: 200px; border-radius: 16px; border: 2px dashed var(--border); background: #ECEAE4; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; margin-bottom: 20px; }
    .image-zone img { width: 100%; height: 100%; object-fit: cover; }
    .image-placeholder { text-align: center; color: var(--muted); }
    .image-placeholder .icon { font-size: 40px; margin-bottom: 8px; }
    .image-placeholder p { font-size: 13px; font-weight: 500; }
    .image-placeholder small { font-size: 11px; display: block; margin-top: 3px; opacity: 0.7; }
    .scan-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #fff; }
    .scan-overlay p { font-size: 13px; font-weight: 600; }

    .spinner { width: 24px; height: 24px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    .spinner-dark { width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
    .badge.ok  { background: #E8F5E9; color: #2E7D32; }
    .badge.err { background: var(--accent-light); color: #C62828; }

    .alert { border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; display: flex; gap: 8px; line-height: 1.5; }
    .alert.error { background: #FDE8E4; border: 1px solid #F4C5BB; color: #C62828; }

    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-group { flex: 1; margin-bottom: 14px; }
    .form-group.half { flex: 1; margin-bottom: 0; }
    label.field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 7px; }

    input, select, textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--white); font-size: 14px; font-family: inherit; color: var(--text); outline: none; transition: border-color 0.2s; -webkit-appearance: none; appearance: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: none; line-height: 1.5; }
    .select-wrap { position: relative; }
    .select-wrap::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

    .btn-add { width: 100%; margin-top: 8px; padding: 17px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; }
    .btn-add:active { transform: scale(0.98); }
    .btn-add:disabled { background: #C5C0B7; cursor: not-allowed; }

    .bottom-nav { background: var(--white); border-top: 1px solid var(--border); padding: 10px 0 env(safe-area-inset-bottom, 10px); display: flex; flex-shrink: 0; }
    .nav-btn { flex: 1; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 0.8px; font-family: inherit; cursor: pointer; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn .nav-icon { font-size: 22px; }

    .inv-card { background: var(--white); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; animation: fadeIn 0.25s ease; }
    .inv-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .inv-thumb-placeholder { width: 60px; height: 60px; border-radius: 10px; background: #ECEAE4; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .inv-color { font-size: 11px; color: #ABABAB; margin-top: 2px; }
    .inv-colombia { font-size: 11px; margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
    .inv-margen { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .inv-margen.pos { background: #E8F5E9; color: #2E7D32; }
    .inv-margen.neg { background: #FDE8E4; color: #C62828; }
    .inv-margen.neu { background: #F5F5F5; color: var(--muted); }
    .inv-delete { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.5; padding: 4px; flex-shrink: 0; }

    .stats-grid { display: flex; gap: 12px; margin-bottom: 20px; }
    .stat-card { flex: 1; background: var(--white); border-radius: 14px; padding: 16px 10px; border: 1px solid var(--border); text-align: center; }
    .stat-icon { font-size: 26px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); margin: 4px 0 2px; }
    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: var(--muted); }
    .stat-card-wide { background: var(--white); border-radius: 14px; padding: 16px 20px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .section-divider { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; color: var(--muted); margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    .key-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; height: 100%; overflow-y: auto; }
    .key-screen .logo-big { font-family: 'DM Serif Display', serif; font-size: 36px; margin-bottom: 6px; }
    .key-screen .logo-big span { color: var(--accent); font-style: italic; }
    .key-screen .desc { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
    .key-screen input { margin-bottom: 14px; font-size: 13px; }
    .key-tip { font-size: 11px; color: var(--muted); margin-top: 14px; line-height: 1.8; }
    .key-tip a { color: var(--accent); }
    .free-badge { display: inline-block; background: #E8F5E9; color: #2E7D32; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 16px; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal { background: var(--white); border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; max-width: 430px; }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .modal-row { margin-bottom: 16px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
    .btn-sec { flex: 1; padding: 14px; background: #F2EFE9; color: var(--text); border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-pri { flex: 1; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .e-icon { font-size: 50px; margin-bottom: 14px; }
    .empty p { font-size: 14px; }
    .empty small { font-size: 12px; display: block; margin-top: 5px; opacity: 0.7; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; opacity: 0.6; padding: 2px 4px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .view { animation: fadeIn 0.25s ease; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const DB_URL = 'https://inventario-c0ab6-default-rtdb.europe-west1.firebasedatabase.app';
const CATEGORIES = ['Zapatillas','Botas','Sandalias','Mocasines','Deportivas','Otro'];
const ENVIO_EUR  = 5;

let state = {
  view:       'scan',
  apiKey:     localStorage.getItem('sb_api_key') || '',
  tasaCambio: Number(localStorage.getItem('sb_tasa') || 4400),
  form:       emptyForm(),
  imageURL:   null,
  _lastFile:  null,
  loading:    false,
  saving:     false,
  aiStatus:   null,
  aiError:    null,
  inventory:  [],
  fbLoading:  true,
  fbError:    null,
  showModal:  false,
};

function emptyForm() {
  return { marca:'', modelo:'', categoria:'Zapatillas', talla:'', color:'',
           cantidad:1, precio:'', precio_colombia:'', notas:'' };
}

function calcMargen(item, tasa) {
  const eur = Number(item.precio||0), cop = Number(item.precio_colombia||0);
  if (!eur||!cop||!tasa) return null;
  return (((cop-(eur+ENVIO_EUR)*tasa)/cop)*100).toFixed(1);
}
function formatCOP(n) {
  return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
}

// ══════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════
async function fbLoad() {
  try {
    const res = await fetch(`${DB_URL}/stockbase.json`);
    const data = await res.json();
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (!data) return [];
    return Object.entries(data).map(([k,v])=>({...v,_key:k})).sort((a,b)=>(b.id||0)-(a.id||0));
  } catch(e) { state.fbError=e.message; return []; }
}
async function fbAdd(item) {
  const res = await fetch(`${DB_URL}/stockbase.json`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
async function fbDelete(key) {
  const res = await fetch(`${DB_URL}/stockbase/${key}.json`,{method:'DELETE'});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}
async function refreshInventory() {
  state.fbLoading=true; state.fbError=null; render();
  state.inventory=await fbLoad();
  state.fbLoading=false; render();
}

// ══════════════════════════════════════════════
//  IMAGEN — pipeline iOS-safe
//
//  iOS Safari tiene bugs con toDataURL() en canvas grandes.
//  Solución: usar toBlob() → FileReader → base64
//  Esto evita el TypeError en Safari iOS.
// ══════════════════════════════════════════════

// Redimensiona un File/Blob a canvas → devuelve Blob via toBlob() (más seguro en iOS)
function resizeToBlob(file, maxPx, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo cargar la imagen')); };
    img.onload  = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > h) { if (w > maxPx) { h = Math.round(h*maxPx/w); w = maxPx; } }
      else        { if (h > maxPx) { w = Math.round(w*maxPx/h); h = maxPx; } }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(blob => {
        if (!blob) return reject(new Error('toBlob() falló'));
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.src = url;
  });
}

// Convierte Blob → base64 string (sin el prefijo data:...)
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('FileReader falló'));
    r.onload  = e => {
      const dataUrl = e.target.result;
      // dataUrl = "data:image/jpeg;base64,XXXXXX"
      const b64 = dataUrl.split(',')[1];
      if (!b64) return reject(new Error('base64 vacío'));
      resolve({ dataUrl, b64 });
    };
    r.readAsDataURL(blob);
  });
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!state.apiKey) { app.innerHTML = renderSetup(); bindSetup(); return; }
  app.innerHTML = `
    ${renderHeader()}
    <div class="content">${
      state.view==='scan'      ? renderScan()      :
      state.view==='inventory' ? renderInventory() : renderStats()
    }</div>
    ${renderNav()}
    ${state.showModal ? renderModal() : ''}
  `;
  bindEvents();
  if (state.view==='scan') {
    requestAnimationFrame(() => {
      const f=state.form;
      const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v||'';};
      set('f-marca',f.marca);set('f-modelo',f.modelo);set('f-cat',f.categoria);
      set('f-talla',f.talla);set('f-color',f.color);set('f-qty',f.cantidad);
      set('f-precio',f.precio);set('f-colombia',f.precio_colombia);set('f-notas',f.notas);
      const btn=document.getElementById('btn-add');
      if(btn) btn.disabled=!f.marca||state.saving;
    });
  }
}

function renderSetup() {
  return `<div style="max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);">
    <div class="key-screen">
      <div class="logo-big">Stock<span>Base</span></div>
      <div class="free-badge">✅ 100% Gratuito · Sin tarjeta</div>
      <p class="desc">Introduce tu API Key de <strong>OpenRouter</strong> para activar la lectura automática de etiquetas con IA.</p>
      <label class="field-label" style="align-self:flex-start">API KEY DE OPENROUTER</label>
      <input type="password" id="key-input" placeholder="sk-or-v1-…" autocomplete="off" />
      <button class="btn-add" id="key-save">ACTIVAR STOCKBASE</button>
      <p class="key-tip">Cómo obtener tu clave gratis:<br>
        1. Ve a <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a><br>
        2. Crea cuenta con Google → <strong>Create Key</strong><br>
        <strong>Sin tarjeta de crédito.</strong></p>
    </div>
  </div>`;
}
function bindSetup() {
  const save=()=>{const v=document.getElementById('key-input').value.trim();if(!v)return;state.apiKey=v;localStorage.setItem('sb_api_key',v);render();};
  document.getElementById('key-save').addEventListener('click',save);
  document.getElementById('key-input').addEventListener('keydown',e=>{if(e.key==='Enter')save();});
}

function renderModal() {
  return `<div class="modal-bg" id="modal-bg"><div class="modal">
    <h3>⚙️ Ajustes</h3>
    <div class="modal-row"><label class="field-label">TASA DE CAMBIO EUR → COP</label>
      <input type="number" id="m-tasa" value="${state.tasaCambio}" placeholder="4400" /></div>
    <div class="modal-row"><label class="field-label">API KEY DE OPENROUTER</label>
      <input type="password" id="m-key" placeholder="Dejar vacío para no cambiar" autocomplete="off" /></div>
    <div class="modal-btns">
      <button class="btn-sec" id="m-cancel">Cancelar</button>
      <button class="btn-pri" id="m-save">Guardar</button>
    </div>
  </div></div>`;
}

function renderHeader() {
  const dotColor=state.fbError?'#C62828':'#4CAF50';
  const label=state.fbLoading?'⏳ Cargando…':state.fbError?'❌ Error DB':'Firebase · Sync';
  return `<div class="header">
    <div class="logo">Stock<span>Base</span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="status-dot"><div class="dot" style="background:${dotColor}"></div>${label}</div>
      <button class="icon-btn" id="btn-refresh">🔄</button>
      <button class="icon-btn" id="btn-settings">⚙️</button>
    </div>
  </div>`;
}

function renderNav() {
  return `<div class="bottom-nav">${[['scan','📷','ESCANEAR'],['inventory','📦','INVENTARIO'],['stats','📊','STATS']].map(([id,icon,label])=>`
    <button class="nav-btn ${state.view===id?'active':''}" data-view="${id}"><span class="nav-icon">${icon}</span>${label}</button>`).join('')}</div>`;
}

function renderScan() {
  const f=state.form;
  const badge=state.aiStatus==='ok'?`<span class="badge ok">✨ Leído por IA</span>`:state.aiStatus==='error'?`<span class="badge err">⚠ Manual</span>`:'';
  const errorAlert=state.aiStatus==='error'?`<div class="alert error">⚠️ No se pudo leer la imagen automáticamente.<br>
    <small style="display:block;margin-top:4px;font-family:monospace;word-break:break-all;opacity:.8">${esc(state.aiError||'')}</small></div>`:'';
  const imgContent=state.imageURL
    ?`<img src="${state.imageURL}" alt="etiqueta" />${state.loading?`<div class="scan-overlay"><div class="spinner"></div><p>Leyendo etiqueta con IA…</p></div>`:''}`
    :`<div class="image-placeholder"><div class="icon">📷</div><p>Toca para fotografiar o elegir foto</p><small>La IA leerá los datos automáticamente</small></div>`;
  return `<div class="view">
    <div class="section-title">NUEVO ARTÍCULO ${badge}</div>
    <div class="image-zone" id="image-zone">${imgContent}</div>
    <input type="file" id="file-input" accept="image/*" style="display:none" />
    ${errorAlert}
    <div class="form-row">
      <div class="form-group half"><label class="field-label">MARCA *</label><input type="text" id="f-marca" placeholder="Nike, Veja…" autocomplete="off" /></div>
      <div class="form-group half"><label class="field-label">MODELO</label><input type="text" id="f-modelo" placeholder="Air Max, Campo…" autocomplete="off" /></div>
    </div>
    <div class="form-group"><label class="field-label">CATEGORÍA</label>
      <div class="select-wrap"><select id="f-cat">${CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group half"><label class="field-label">TALLA</label><input type="text" id="f-talla" placeholder="EUR 40" autocomplete="off" /></div>
      <div class="form-group half"><label class="field-label">COLOR</label><input type="text" id="f-color" placeholder="Blanco…" autocomplete="off" /></div>
    </div>
    <div class="form-row">
      <div class="form-group half"><label class="field-label">CANTIDAD</label><input type="number" id="f-qty" min="1" value="1" /></div>
      <div class="form-group half"><label class="field-label">PRECIO COSTE (€)</label><input type="number" id="f-precio" placeholder="0.00" /></div>
    </div>
    <div class="form-row">
      <div class="form-group half"><label class="field-label">PRECIO VENTA COLOMBIA (COP)</label><input type="number" id="f-colombia" placeholder="180000" /></div>
      <div class="form-group half"><label class="field-label">MARGEN ESTIMADO</label>
        <div style="padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:#FAFAFA;font-size:14px;color:var(--muted);min-height:48px" id="margen-preview">—</div>
      </div>
    </div>
    <div class="form-group"><label class="field-label">NOTAS</label><textarea id="f-notas" rows="2" placeholder="Referencia, material, país…"></textarea></div>
    <button class="btn-add" id="btn-add" disabled>${state.saving?'⏳ Guardando…':'+ AÑADIR AL INVENTARIO'}</button>
  </div>`;
}

function updateMargenPreview() {
  const eur=Number(document.getElementById('f-precio')?.value||0);
  const cop=Number(document.getElementById('f-colombia')?.value||0);
  const el=document.getElementById('margen-preview');
  if(!el) return;
  if(!eur||!cop){el.textContent='—';el.style.color='var(--muted)';return;}
  const m=(((cop-(eur+ENVIO_EUR)*state.tasaCambio)/cop)*100).toFixed(1);
  el.textContent=m+'%'; el.style.color=m>=0?'#2E7D32':'#C62828'; el.style.fontWeight='700';
}

function renderInventory() {
  if(state.fbLoading) return `<div class="view"><div class="section-title">INVENTARIO</div><div class="empty"><div class="spinner-dark"></div><p>Cargando desde Firebase…</p></div></div>`;
  if(state.fbError)   return `<div class="view"><div class="section-title">INVENTARIO</div><div class="alert error">❌ ${esc(state.fbError)}</div></div>`;
  const items=state.inventory;
  if(!items.length) return `<div class="view"><div class="section-title">INVENTARIO</div><div class="empty"><div class="e-icon">📦</div><p>Sin artículos todavía</p><small>Escanea tu primera etiqueta</small></div></div>`;
  return `<div class="view">
    <div class="section-title">INVENTARIO <span style="color:var(--accent)">${items.length}</span></div>
    ${items.map(item=>{
      const margen=calcMargen(item,state.tasaCambio);
      const mClass=margen===null?'neu':margen>=0?'pos':'neg';
      const mLabel=margen===null?'':`<span class="inv-margen ${mClass}">Margen ${margen}%</span>`;
      const copLabel=item.precio_colombia?`<span style="color:var(--muted)">🇨🇴 ${formatCOP(item.precio_colombia)}</span>`:'';
      return `<div class="inv-card">
        ${item.imagen?`<img class="inv-thumb" src="${item.imagen}" onerror="this.style.display='none'" />`:`<div class="inv-thumb-placeholder">👟</div>`}
        <div class="inv-info">
          <div class="inv-name">${esc(item.marca)} ${esc(item.modelo)}</div>
          <div class="inv-meta">${esc(item.categoria)} · T ${esc(item.talla)} · ×${item.cantidad}${item.precio?' · €'+item.precio:''}</div>
          ${item.color?`<div class="inv-color">${esc(item.color)}</div>`:''}
          ${(copLabel||mLabel)?`<div class="inv-colombia">${copLabel}${mLabel}</div>`:''}
        </div>
        <button class="inv-delete" data-key="${esc(item._key)}">🗑</button>
      </div>`;
    }).join('')}
  </div>`;
}

function renderStats() {
  const inv=state.inventory;
  const total=inv.reduce((s,i)=>s+Number(i.cantidad||0),0);
  const brands=new Set(inv.map(i=>i.marca).filter(Boolean)).size;
  const cats=inv.reduce((acc,i)=>{acc[i.categoria]=(acc[i.categoria]||0)+1;return acc;},{});
  const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const valor=inv.reduce((s,i)=>s+(Number(i.precio||0)*Number(i.cantidad||0)),0);
  const conColombia=inv.filter(i=>i.precio&&i.precio_colombia);
  const margenes=conColombia.map(i=>Number(calcMargen(i,state.tasaCambio))).filter(m=>!isNaN(m));
  const margenMedio=margenes.length?(margenes.reduce((a,b)=>a+b,0)/margenes.length).toFixed(1):null;
  const totalCOP=inv.reduce((s,i)=>s+(Number(i.precio_colombia||0)*Number(i.cantidad||0)),0);
  return `<div class="view">
    <div class="section-title">ESTADÍSTICAS</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">📦</div><div class="stat-value">${total}</div><div class="stat-label">UNIDADES</div></div>
      <div class="stat-card"><div class="stat-icon">🏷</div><div class="stat-value">${brands}</div><div class="stat-label">MARCAS</div></div>
      <div class="stat-card"><div class="stat-icon">👟</div><div class="stat-value">${inv.length}</div><div class="stat-label">MODELOS</div></div>
    </div>
    ${valor>0?`<div class="stat-card-wide" style="margin-bottom:12px"><div><div class="stat-label">VALOR COSTE TOTAL (€)</div><div class="stat-value" style="font-size:28px">€${valor.toFixed(0)}</div></div><div style="font-size:36px">💶</div></div>`:''}
    ${topCat?`<div class="stat-card-wide" style="margin-bottom:20px"><div><div class="stat-label">CATEGORÍA TOP</div><div style="font-size:18px;font-weight:700;margin-top:4px">${topCat[0]}</div></div><div style="font-size:36px">🥇</div></div>`:''}
    <div class="section-divider">🇨🇴 COLOMBIA</div>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div class="stat-card"><div class="stat-icon">📊</div><div class="stat-value" style="font-size:22px">${margenMedio!==null?margenMedio+'%':'—'}</div><div class="stat-label">MARGEN MEDIO</div></div>
      <div class="stat-card"><div class="stat-icon">🇨🇴</div><div class="stat-value" style="font-size:16px">${totalCOP>0?formatCOP(totalCOP):'—'}</div><div class="stat-label">VALOR VENTA COP</div></div>
    </div>
    <div class="stat-card-wide" style="margin-bottom:12px">
      <div><div class="stat-label">TASA DE CAMBIO ACTUAL</div>
        <div style="font-size:18px;font-weight:700;margin-top:4px">1 € = ${Number(state.tasaCambio).toLocaleString('es-CO')} COP</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Envío incluido: +${ENVIO_EUR}€ por par</div>
      </div>
      <div style="font-size:32px">💱</div>
    </div>
    ${!inv.length?`<div class="empty"><div class="e-icon">📊</div><p>Añade artículos para ver estadísticas</p></div>`:''}
  </div>`;
}

// ══════════════════════════════════════════════
//  EVENTOS
// ══════════════════════════════════════════════
function bindEvents() {
  document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const v=btn.dataset.view; state.view=v;
    if(v==='inventory'||v==='stats') refreshInventory(); else render();
  }));
  document.getElementById('btn-refresh')?.addEventListener('click',refreshInventory);
  document.getElementById('btn-settings')?.addEventListener('click',()=>{state.showModal=true;render();});
  document.getElementById('m-cancel')?.addEventListener('click',()=>{state.showModal=false;render();});
  document.getElementById('modal-bg')?.addEventListener('click',e=>{if(e.target.id==='modal-bg'){state.showModal=false;render();}});
  document.getElementById('m-save')?.addEventListener('click',()=>{
    const tasa=Number(document.getElementById('m-tasa').value);
    if(tasa>0){state.tasaCambio=tasa;localStorage.setItem('sb_tasa',tasa);}
    const key=document.getElementById('m-key').value.trim();
    if(key){state.apiKey=key;localStorage.setItem('sb_api_key',key);}
    state.showModal=false;render();
  });
  document.querySelectorAll('.inv-delete').forEach(btn=>btn.addEventListener('click',async()=>{
    if(!confirm('¿Eliminar este artículo?')) return;
    try{await fbDelete(btn.dataset.key);await refreshInventory();}catch(e){alert('Error: '+e.message);}
  }));

  if(state.view!=='scan') return;

  document.getElementById('image-zone')?.addEventListener('click',()=>{
    if(!state.loading&&!state.saving) document.getElementById('file-input').click();
  });
  document.getElementById('file-input')?.addEventListener('change',handleFile);

  ['marca','modelo','talla','color','notas'].forEach(k=>{
    document.getElementById('f-'+k)?.addEventListener('input',e=>{
      state.form[k]=e.target.value;
      document.getElementById('btn-add').disabled=!state.form.marca||state.saving;
    });
  });
  [['f-cat','categoria'],['f-qty','cantidad']].forEach(([id,key])=>{
    document.getElementById(id)?.addEventListener('change',e=>{state.form[key]=e.target.value;});
  });
  document.getElementById('f-precio')?.addEventListener('input',   e=>{state.form.precio=e.target.value;updateMargenPreview();});
  document.getElementById('f-colombia')?.addEventListener('input', e=>{state.form.precio_colombia=e.target.value;updateMargenPreview();});

  document.getElementById('btn-add')?.addEventListener('click',async()=>{
    if(!state.form.marca||state.saving) return;
    state.saving=true; render();
    try {
      let imagen=null;
      if(state._lastFile) {
        // miniatura para Firebase: 320px via pipeline seguro
        const blob=await resizeToBlob(state._lastFile,320,0.65);
        const {dataUrl}=await blobToBase64(blob);
        imagen=dataUrl;
      }
      await fbAdd({
        ...state.form,
        cantidad:        Number(state.form.cantidad)||1,
        precio:          state.form.precio!==''          ?Number(state.form.precio)         :'',
        precio_colombia: state.form.precio_colombia!=='' ?Number(state.form.precio_colombia):'',
        id:Date.now(), imagen:imagen||null,
      });
      state.form=emptyForm();state.imageURL=null;state._lastFile=null;
      state.aiStatus=null;state.aiError=null;state.saving=false;
      state.view='inventory';
      await refreshInventory();
    } catch(e){alert('Error al guardar: '+e.message);state.saving=false;render();}
  });
}

// ══════════════════════════════════════════════
//  OPENROUTER — LECTURA DE ETIQUETA
//
//  Pipeline iOS-safe:
//  1. File → resizeToBlob() (canvas.toBlob, sin toDataURL)
//  2. Blob → blobToBase64() (FileReader, sin string largo en memoria)
//  3. base64 → fetch a OpenRouter
//
//  Modelos actualizados (mayo 2026):
//  qwen2.5-vl-7b es especialista en OCR/documentos, probado con OpenRouter
// ══════════════════════════════════════════════
function handleFile(e) {
  const file=e.target.files[0];
  if(!file) return;
  state._lastFile=file;
  state.aiStatus=null;state.aiError=null;state.form=emptyForm();state.loading=true;
  if(state.imageURL) URL.revokeObjectURL(state.imageURL);
  state.imageURL=URL.createObjectURL(file);
  render();

  // Pipeline seguro: File → Blob redimensionado → base64 → API
  resizeToBlob(file, 768, 0.80)           // 768px, calidad alta para leer texto
    .then(blob => blobToBase64(blob))      // Blob → dataUrl via FileReader
    .then(({dataUrl}) => readWithOpenRouter(dataUrl))
    .catch(err => {
      state.aiError='Error al procesar imagen: '+err.message;
      state.aiStatus='error';state.loading=false;render();
    });
}

async function readWithOpenRouter(dataUrl) {
  // Modelos gratuitos con visión probados en OpenRouter (mayo 2026)
  const MODELS = [
    'qwen/qwen2.5-vl-7b-instruct:free',    // Especialista OCR/documentos, muy probado
    'meta-llama/llama-4-maverick:free',     // Multimodal potente
    'meta-llama/llama-4-scout:free',        // Más rápido
    'qwen/qwen2.5-vl-32b-instruct:free',   // Mayor capacidad
  ];

  const PROMPT = 'Look at this shoe box label. Extract: brand (marca), model name (modelo), category from [Zapatillas,Botas,Sandalias,Mocasines,Deportivas,Otro] (categoria), EU size (talla, empty if not visible), color (empty if not visible), SKU/reference code (notas). Reply ONLY with raw JSON no backticks: {"marca":"...","modelo":"...","categoria":"...","talla":"...","color":"...","notas":"..."}';

  const errors=[];

  for (const model of MODELS) {
    try {
      const payload = {
        model,
        max_tokens: 300,
        temperature: 0.1,
        messages: [{
          role: 'user',
          content: [
            { type: 'text', text: PROMPT },
            { type: 'image_url', image_url: { url: dataUrl } }
          ]
        }]
      };

      // Usar TextEncoder para evitar el problema de stringify con strings grandes
      const bodyStr = JSON.stringify(payload);
      const bodyBytes = new TextEncoder().encode(bodyStr);

      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${state.apiKey}`,
          'Content-Type':  'application/json',
          'HTTP-Referer':  'https://abrahamparraboquizo-cloud.github.io',
          'X-Title':       'StockBase',
        },
        body: bodyBytes
      });

      const json = await res.json().catch(()=>({}));

      if (!res.ok) {
        const msg=json?.error?.message||json?.error?.code||`HTTP ${res.status}`;
        errors.push(`${model}: ${String(msg).substring(0,100)}`);
        continue;
      }

      const raw=json?.choices?.[0]?.message?.content||'';
      if(!raw){errors.push(`${model}: vacío`);continue;}

      const clean=raw.replace(/^```json\s*/i,'').replace(/^```/,'').replace(/```$/,'').trim();
      const match=clean.match(/\{[\s\S]*\}/);
      if(!match){errors.push(`${model}: sin JSON en "${clean.substring(0,50)}"`);continue;}

      const p=JSON.parse(match[0]);
      state.form.marca     = String(p.marca  ||'').trim();
      state.form.modelo    = String(p.modelo ||'').trim();
      state.form.categoria = CATEGORIES.includes(p.categoria)?p.categoria:'Zapatillas';
      state.form.talla     = String(p.talla  ||'').trim();
      state.form.color     = String(p.color  ||'').trim();
      state.form.notas     = String(p.notas  ||'').trim();
      state.aiStatus='ok';state.loading=false;render();
      return;

    } catch(err) {
      errors.push(`${model}: ${err.message.substring(0,80)}`);
    }
  }

  state.aiError=errors.join(' | ');
  state.aiStatus='error';state.loading=false;render();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

refreshInventory();
</script>
