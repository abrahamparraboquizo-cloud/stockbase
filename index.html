const compressImg = (dataUrl,size=320,q=0.72) => new Promise(res=>{
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement("canvas");
    const r=Math.min(size/img.width,size/img.height,1);
    c.width=img.width*r; c.height=img.height*r;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",q));
  };
  img.src=dataUrl;
});

class FB {
  constructor(url){this.base=url.replace(/\/$/,"")}
  async get(p=""){return(await fetch(`${this.base}/${p}.json`)).json()}
  async push(p,d){return(await fetch(`${this.base}/${p}.json`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...d,_ts:Date.now()})})).json()}
  async patch(p,d){return fetch(`${this.base}/${p}.json`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})}
  async del(p){return fetch(`${this.base}/${p}.json`,{method:"DELETE"})}
}

async function scanLabel(base64,mime,key){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
    {method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({contents:[{parts:[
       {inline_data:{mime_type:mime,data:base64}},
       {text:`Analiza esta etiqueta de ropa o calzado. Responde SOLO con JSON puro sin markdown:\n{"marca":"","modelo":"","talla":"","color":"","categoria":"","referencia":""}\nCategoria debe ser una de: ${CATS.join(", ")}.\nSi no encuentras un campo dejalo vacio. SOLO JSON.`}
     ]}],generationConfig:{temperature:0.1,maxOutputTokens:250}})});
  const d=await r.json();
  const t=d.candidates?.[0]?.content?.parts?.[0]?.text||"{}";
  try{return JSON.parse(t.replace(/```[a-z]*|```/g,"").trim())}catch{return{}}
}

function SetupScreen({onSave}){
  const [gemKey,setGemKey]=useState("");
  const [fbUrl,setFbUrl]=useState("");
  const [name,setName]=useState("");
  const [mode,setMode]=useState("shared");
  return(
    <div className="setup">
      <style>{CSS}</style>
      <div className="setup-logo">Stock<em>Base</em></div>
      <p className="setup-sub">Control de inventario con IA<br/>España → Colombia</p>
      <div className="mode-pill">
        <button className={`mode-opt ${mode==="shared"?"on":""}`} onClick={()=>setMode("shared")}>🔗 Compartido</button>
        <button className={`mode-opt ${mode==="demo"?"on":""}`} onClick={()=>setMode("demo")}>📱 Solo local</button>
      </div>
      <div className="setup-card">
        <div className="setup-step">Tu nombre</div>
        <input className="inp" placeholder="ej. María o Pablo" value={name} onChange={e=>setName(e.target.value)}/>
        <p className="setup-help">Aparecerá en los artículos para saber quién los añadió.</p>
      </div>
      <div className="setup-card">
        <div className="setup-step">IA para leer etiquetas — Google Gemini (gratis)</div>
        <input className="inp" placeholder="AIza..." value={gemKey} onChange={e=>setGemKey(e.target.value)}/>
        <p className="setup-help">Ve a <a className="setup-link" href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a> → copia tu clave existente.</p>
      </div>
      {mode==="shared"&&(
        <div className="setup-card">
          <div className="setup-step">Base de datos compartida — Firebase (gratis)</div>
          <input className="inp" placeholder="https://mi-app-rtdb.firebaseio.com" value={fbUrl} onChange={e=>setFbUrl(e.target.value)}/>
          <p className="setup-help"><a className="setup-link" href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a> → Proyecto → Build → Realtime Database → Copiar URL</p>
        </div>
      )}
      {mode==="shared"?(
        <button className="btn btn-p" style={{width:"100%",marginBottom:10}} onClick={()=>onSave({mode:"shared",name:name||"Usuario",gemKey,fbUrl})} disabled={!gemKey.trim()||!fbUrl.trim()}>{I.check} Conectar y empezar</button>
      ):(
        <button className="btn btn-p" style={{width:"100%",marginBottom:10}} onClick={()=>onSave({mode:"demo",name:name||"Usuario",gemKey,fbUrl:""})}>{I.check} Empezar en modo local</button>
      )}
      <p className="hint">En modo compartido los dos accedéis al mismo inventario en tiempo real.</p>
    </div>
  );
}

function MainApp({config,onReset}){
  const [tab,setTab]=useState("scan");
  const [items,setItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [synced,setSynced]=useState(config.mode==="demo");
  const [form,setForm]=useState(null);
  const [imgPrev,setImgPrev]=useState(null);
  const [scanning,setScanning]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState(null);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("Todos");
  const [editId,setEditId]=useState(null);
  const [confirmDel,setConfirmDel]=useState(null);
  const fileRef=useRef();
  const camRef=useRef();
  const db=config.mode==="shared"?new FB(config.fbUrl):null;
  const toast$=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200)};
  const load=useCallback(async()=>{
    if(config.mode==="demo"){try{setItems(JSON.parse(localStorage.getItem("sb_items")||"[]"))}catch{setItems([])}setLoading(false);return}
    try{const data=await db.get("items");const arr=data?Object.entries(data).map(([id,v])=>({...v,id})).sort((a,b)=>(b._ts||0)-(a._ts||0)):[];setItems(arr);setSynced(true)}catch{toast$("Sin conexión","err")}finally{setLoading(false)}
  },[config]);
  useEffect(()=>{load()},[load]);
  useEffect(()=>{if(config.mode!=="shared")return;const t=setInterval(load,25000);return()=>clearInterval(t)},[load,config.mode]);
  const localSave=arr=>localStorage.setItem("sb_items",JSON.stringify(arr));
  const handleImage=useCallback(async(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async e=>{
      const dataUrl=e.target.result;setImgPrev(dataUrl);setScanning(true);setTab("scan");
      let extracted={};
      if(config.gemKey){try{extracted=await scanLabel(dataUrl.split(",")[1],file.type||"image/jpeg",config.gemKey)}catch{toast$("Error de IA","err")}}
      const thumb=await compressImg(dataUrl,320,0.72);
      setForm({id:genId(),marca:"",modelo:"",talla:"",color:"",categoria:"Zapatillas",cantidad:1,notas:"",precioEur:"",precioVentaCop:"",imagen:thumb,addedBy:config.name,fecha:new Date().toISOString(),...extracted,categoria:CATS.includes(extracted.categoria)?extracted.categoria:"Zapatillas"});
      setScanning(false);setTab("form");
    };
    reader.readAsDataURL(file);
  },[config]);
  const save=async()=>{
    if(!form.marca&&!form.modelo){toast$("Añade marca o modelo","err");return}
    setSaving(true);
    try{
      if(config.mode==="shared"){if(editId)await db.patch(`items/${editId}`,{...form,_ts:Date.now()});else await db.push("items",form);await load()}
      else{const upd=editId?items.map(i=>i.id===editId?{...form}:i):[{...form,_ts:Date.now()},...items];setItems(upd);localSave(upd)}
      toast$(editId?"Actualizado ✓":"Añadido ✓");setForm(null);setImgPrev(null);setEditId(null);setTab("stock");
    }catch{toast$("Error al guardar","err")}
    setSaving(false);
  };
  const del=async id=>{
    try{if(config.mode==="shared"){await db.del(`items/${id}`);await load()}else{const upd=items.filter(i=>i.id!==id);setItems(upd);localSave(upd)}toast$("Eliminado")}catch{toast$("Error","err")}
    setConfirmDel(null);
  };
  const openEdit=item=>{setForm({...item});setImgPrev(item.imagen||null);setEditId(item.id);setTab("form")};
  const openNew=()=>{setForm({id:genId(),marca:"",modelo:"",talla:"",color:"",categoria:"Zapatillas",cantidad:1,notas:"",precioEur:"",precioVentaCop:"",imagen:null,addedBy:config.name,fecha:new Date().toISOString()});setImgPrev(null);setEditId(null)};
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const filtered=items.filter(i=>{const q=search.toLowerCase();const m=!q||[i.marca,i.modelo,i.talla,i.color,i.categoria,i.notas].some(v=>v?.toLowerCase().includes(q));return m&&(filterCat==="Todos"||i.categoria===filterCat)});
  const totalUnits=items.reduce((s,i)=>s+(+i.cantidad||0),0);
  const totalCost=items.reduce((s,i)=>s+(+i.precioEur||0)*(+i.cantidad||1),0);
  const totalSale=items.reduce((s,i)=>s+(+i.precioVentaCop||0)*(+i.cantidad||1),0);
  const margin=totalCost>0&&totalSale>0?Math.round((totalSale/EUR_COP/totalCost-1)*100):0;
  const byCat=CATS.map(c=>({name:c,icon:CAT_MAP[c],uds:items.filter(i=>i.categoria===c).reduce((s,i)=>s+(+i.cantidad||0),0),cost:items.filter(i=>i.categoria===c).reduce((s,i)=>s+(+i.precioEur||0)*(+i.cantidad||1),0)})).filter(c=>c.uds>0);
  const exportCSV=()=>{
    const h=["Fecha","Añadido por","Categoría","Marca","Modelo","Talla","Color","Cantidad","Coste EUR","Precio COP","Margen %","Notas"];
    const rows=items.map(i=>[i.fecha?.slice(0,10),i.addedBy,i.categoria,i.marca,i.modelo,i.talla,i.color,i.cantidad,i.precioEur,i.precioVentaCop,i.precioEur&&i.precioVentaCop?Math.round((+i.precioVentaCop/EUR_COP/(+i.precioEur)-1)*100)+"%":"",i.notas]);
    const csv=[h,...rows].map(r=>r.map(c=>`"${c??""}"`.replace(/"/g,'""')).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));a.download=`stockbase_${new Date().toISOString().slice(0,10)}.csv`;a.click();
    toast$("CSV descargado");
  };
  const mgClass=p=>p>=30?"mg-good":p>=10?"mg-mid":"mg-bad";
  const copSug=form?.precioEur?Math.round(+form.precioEur*EUR_COP):null;
  const formMg=form?.precioEur&&form?.precioVentaCop?Math.round((+form.precioVentaCop/EUR_COP/(+form.precioEur)-1)*100):null;
  return(<>
    <style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        <div className="logo">Stock<em>Base</em></div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="sync-dot"><span className={`dot ${synced?"":"off"}`}/>{config.mode==="demo"?"Local":synced?"Sincronizado":"Sin conexión"}</div>
          {config.mode==="shared"&&<button className="icon-btn" onClick={load}>{I.refresh}</button>}
          <button className="icon-btn" onClick={onReset}>{I.cog}</button>
        </div>
      </header>
      <div className="scroll">
        {tab==="scan"&&<>
          <div className="scan-frame" onClick={()=>fileRef.current.click()}>
            {imgPrev?<img src={imgPrev} alt="etiqueta"/>:<div className="scan-ph"><span className="big">📷</span><p>Toca para fotografiar<br/>la etiqueta</p></div>}
            <span className="corner c-tl"/><span className="corner c-tr"/><span className="corner c-bl"/><span className="corner c-br"/>
            {scanning&&<div className="scan-overlay"><span className="pls">🤖</span><span style={{fontSize:15,fontWeight:500}}>Analizando con IA…</span></div>}
          </div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleImage(e.target.files[0])}/>
          <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>handleImage(e.target.files[0])}/>
          <div className="btn-row" style={{marginBottom:14}}>
            <button className="btn btn-p" onClick={()=>camRef.current.click()} disabled={scanning}>{I.camera} Cámara</button>
            <button className="btn btn-s" onClick={()=>fileRef.current.click()} disabled={scanning}>🖼 Galería</button>
            <button className="btn btn-ghost" style={{flex:"0 0 auto",padding:"13px 14px"}} onClick={()=>{openNew();setTab("form")}}>{I.plus}</button>
          </div>
          {!config.gemKey&&<div className="warn"><p><strong>Sin clave Gemini:</strong> configura tu clave en ajustes para activar la IA.</p></div>}
          {items.length>0&&<div className="qs">
            <div className="qs-item"><div className="qs-val">{totalUnits}</div><div className="qs-lbl">Unidades</div></div>
            <div className="qs-item"><div className="qs-val" style={{color:"var(--red)",fontSize:18}}>{fmtEUR(totalCost)}</div><div className="qs-lbl">Invertido</div></div>
            <div className="qs-item"><div className="qs-val" style={{color:"var(--green)",fontSize:18}}>{(totalSale/1e6).toFixed(1)}M</div><div className="qs-lbl">Venta COP</div></div>
          </div>}
          <p className="hint">La IA extrae marca, modelo, talla y color.<br/>Tú añades los precios y revisas los datos.</p>
        </>}
        {tab==="form"&&form&&<>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <span className="sec" style={{marginBottom:0,borderBottom:"none"}}>{editId?"Editar artículo":"Nuevo artículo"}</span>
            {imgPrev&&<span className="ai-chip">✨ Leído por IA</span>}
          </div>
          {imgPrev&&<img src={imgPrev} alt="" style={{width:"100%",aspectRatio:"16/9",objectFit:"cover",borderRadius:12,marginBottom:13,border:"1px solid var(--border)"}}/>}
          <div className="two">
            <div className="fld"><label className="lbl">Marca *</label><input className="inp" value={form.marca} onChange={e=>setF("marca",e.target.value)} placeholder="Nike…"/></div>
            <div className="fld"><label className="lbl">Modelo</label><input className="inp" value={form.modelo} onChange={e=>setF("modelo",e.target.value)} placeholder="Air Max…"/></div>
          </div>
          <div className="fld"><label className="lbl">Categoría</label><select className="sel" value={form.categoria} onChange={e=>setF("categoria",e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
          <div className="two">
            <div className="fld"><label className="lbl">Talla</label><input className="inp" value={form.talla} onChange={e=>setF("talla",e.target.value)} placeholder="42, M…"/></div>
            <div className="fld"><label className="lbl">Color</label><input className="inp" value={form.color} onChange={e=>setF("color",e.target.value)} placeholder="Negro…"/></div>
          </div>
          <div className="fld"><label className="lbl">Cantidad</label><input className="inp" type="number" min="1" value={form.cantidad} onChange={e=>setF("cantidad",e.target.value)}/></div>
          <div className="price-box">
            <div className="price-box-title">💶 Coste Europa → 🇨🇴 Precio Colombia</div>
            <div className="two">
              <div className="fld" style={{marginBottom:0}}><label className="lbl">Coste (€)</label><input className="inp" type="number" value={form.precioEur} onChange={e=>setF("precioEur",e.target.value)} placeholder="0"/></div>
              <div className="fld" style={{marginBottom:0}}>
                <label className="lbl">Venta (COP)</label>
                <input className="inp" type="number" value={form.precioVentaCop} onChange={e=>setF("precioVentaCop",e.target.value)} placeholder={copSug?String(copSug):"0"}/>
                {copSug&&!form.precioVentaCop&&<div className="cop-hint">↗ Sugerido: {fmtCOP(copSug)}</div>}
              </div>
            </div>
            {formMg!==null&&<div className="margin-row"><span style={{color:"var(--muted)"}}>Margen estimado</span><span className={`mg-pct ${mgClass(formMg)}`}>{formMg>=0?"+":""}{formMg}%</span></div>}
          </div>
          <div className="fld"><label className="lbl">Notas</label><textarea className="txta" value={form.notas} onChange={e=>setF("notas",e.target.value)} placeholder="Referencia, estado, ubicación…"/></div>
          <div className="btn-row" style={{marginTop:6}}>
            <button className="btn btn-g" style={{flex:2}} onClick={save} disabled={saving}>{saving?<span className="spin">⏳</span>:I.check}{saving?"Guardando…":editId?"Actualizar":"Añadir al stock"}</button>
            <button className="btn btn-ghost" onClick={()=>{setForm(null);setImgPrev(null);setEditId(null);setTab("scan")}}>{I.x}</button>
          </div>
        </>}
        {tab==="stock"&&<>
          <div className="sbar">
            <input className="sinp" placeholder="🔍 Buscar…" value={search} onChange={e=>setSearch(e.target.value)}/>
            <button className="btn btn-s" style={{flex:"0 0 auto",padding:"10px 12px"}} onClick={exportCSV}>{I.download}</button>
          </div>
          <div className="chips">{["Todos",...CATS].map(c=><button key={c} className={`chip ${filterCat===c?"on":""}`} onClick={()=>setFilterCat(c)}>{CAT_MAP[c]||""} {c}</button>)}</div>
          {loading?<div className="empty"><div className="empty-ico">⏳</div><p>Cargando…</p></div>
           :filtered.length===0?<div className="empty"><div className="empty-ico">{search?"🔍":"📦"}</div><p>{search?"Sin resultados":"No hay artículos aún."}</p></div>
           :filtered.map(item=>{
             const mg=item.precioEur&&item.precioVentaCop?Math.round((+item.precioVentaCop/EUR_COP/(+item.precioEur)-1)*100):null;
             return(<div key={item.id} className="item">
               <div className="thumb">{item.imagen?<img src={item.imagen} alt=""/>:CAT_MAP[item.categoria]||"📦"}</div>
               <div className="ibody">
                 <div className="ibrand">{item.marca||"—"}</div>
                 <div className="imodel">{item.modelo||"Sin modelo"}</div>
                 <div className="imeta">{[item.color,item.fecha?.slice(0,10)].filter(Boolean).join(" · ")}</div>
                 <div className="itags">
                   <span className="tag t-cat">{item.categoria}</span>
                   {item.talla&&<span className="tag t-sz">T {item.talla}</span>}
                   {item.cantidad>1&&<span className="tag t-qty">×{item.cantidad}</span>}
                   {item.addedBy&&<span className="tag t-who">{item.addedBy}</span>}
                 </div>
                 <div className="iactions">
                   <button className="btn btn-s btn-xs" onClick={()=>openEdit(item)} style={{gap:4}}>{I.edit} Editar</button>
                   <button className="btn btn-xs" style={{background:"var(--red-light)",color:"var(--red)",border:"1px solid var(--red-mid)",gap:4}} onClick={()=>setConfirmDel(item.id)}>{I.trash} Vendido</button>
                 </div>
               </div>
               <div className="iright">
                 {item.precioEur&&<div className="peur">{fmtEUR(+item.precioEur)}</div>}
                 {item.precioVentaCop&&<div className="pcop">{(+item.precioVentaCop/1e6).toFixed(1)}M COP</div>}
                 {mg!==null&&<div className={`pmgn ${mgClass(mg)}`}>{mg>=0?"+":""}{mg}%</div>}
               </div>
             </div>);
           })}
        </>}
        {tab==="stats"&&<>
          <div className="stat-grid">
            <div className="stat"><div className="stat-lbl">Unidades</div><div className="stat-val">{totalUnits}</div><div className="stat-sub">{items.length} referencias</div></div>
            <div className="stat"><div className="stat-lbl">Inversión</div><div className="stat-val" style={{color:"var(--red)",fontSize:20}}>{fmtEUR(totalCost)}</div><div className="stat-sub">en euros</div></div>
            <div className="stat"><div className="stat-lbl">Precio venta</div><div className="stat-val" style={{color:"var(--green)",fontSize:20}}>{(totalSale/1e6).toFixed(1)}M</div><div className="stat-sub">pesos COP</div></div>
            <div className="stat"><div className="stat-lbl">Margen medio</div><div className="stat-val" style={{color:margin>=20?"var(--green)":margin>=5?"var(--gold)":"var(--red)",fontSize:22}}>{margin>=0?"+":""}{margin}%</div><div className="stat-sub">EUR → COP</div></div>
          </div>
          {byCat.length>0&&<div className="chart-card">
            <div className="chart-ttl">Unidades por categoría</div>
            <ResponsiveContainer width="100%" height={190}>
              <BarChart data={byCat} barCategoryGap="35%">
                <XAxis dataKey="icon" tick={{fontSize:20}} tickLine={false} axisLine={false}/>
                <YAxis hide/>
                <Tooltip formatter={v=>[v+" uds"]} labelFormatter={(_,pl)=>pl?.[0]?.payload?.name||""} contentStyle={{fontFamily:"Outfit,sans-serif",fontSize:13,borderRadius:10,border:"1px solid #E3DDD4"}}/>
                <Bar dataKey="uds" radius={[6,6,0,0]}>{byCat.map((_,i)=><Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]}/>)}</Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>}
          {byCat.length>1&&<div className="chart-card">
            <div className="chart-ttl">Inversión por categoría (€)</div>
            <ResponsiveContainer width="100%" height={210}>
              <PieChart>
                <Pie data={byCat} dataKey="cost" nameKey="name" cx="50%" cy="50%" outerRadius={82} innerRadius={38} label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`} labelLine={false} fontSize={11}>
                  {byCat.map((_,i)=><Cell key={i} fill={PIE_COLORS[i%PIE_COLORS.length]}/>)}
                </Pie>
                <Tooltip formatter={v=>[fmtEUR(v),"Coste"]} contentStyle={{fontFamily:"Outfit,sans-serif",fontSize:13,borderRadius:10}}/>
              </PieChart>
            </ResponsiveContainer>
          </div>}
          <div className="chart-card">
            <div className="chart-ttl">Detalle por categoría</div>
            {byCat.length===0?<p style={{color:"var(--muted)",fontSize:13}}>Sin datos todavía.</p>
             :byCat.map((c,i)=>(
              <div key={c.name} className="cat-row" style={{borderBottom:i<byCat.length-1?"1px solid var(--border)":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:24}}>{c.icon}</span>
                  <div><div style={{fontWeight:600,fontSize:14}}>{c.name}</div><div style={{fontSize:11.5,color:"var(--muted)"}}>{c.uds} uds</div></div>
                </div>
                <div style={{fontFamily:"Playfair Display,serif",fontSize:18,fontWeight:700,color:"var(--red)"}}>{fmtEUR(c.cost)}</div>
              </div>
            ))}
          </div>
          <button className="btn btn-s" style={{width:"100%",marginTop:4}} onClick={exportCSV}>{I.download} Exportar a Google Sheets / Excel</button>
        </>}
      </div>
      <nav className="nav">
        {[{id:"scan",icon:I.scan,lbl:"Escanear"},{id:"stock",icon:I.box,lbl:"Inventario"},{id:"stats",icon:I.chart,lbl:"Estadísticas"}].map(t=>(
          <button key={t.id} className={`nb ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>{t.icon}{t.lbl}</button>
        ))}
        <button className="nb" onClick={()=>{openNew();setTab("form")}}>
          <div className="nb-fab">{I.plus}<span style={{fontSize:9,fontWeight:600,color:"white",fontFamily:"Outfit,sans-serif",textTransform:"uppercase",letterSpacing:".3px"}}>Añadir</span></div>
        </button>
      </nav>
    </div>
    {confirmDel&&<div className="modal-bg" onClick={()=>setConfirmDel(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-ttl">¿Marcar como vendido?</div>
        <p className="modal-sub">El artículo se eliminará del inventario. No se puede deshacer.</p>
        <div className="btn-row">
          <button className="btn btn-p" style={{flex:1}} onClick={()=>del(confirmDel)}>Sí, vendido</button>
          <button className="btn btn-s" style={{flex:1}} onClick={()=>setConfirmDel(null)}>Cancelar</button>
        </div>
      </div>
    </div>}
    {toast&&<div className={`toast t-${toast.type}`}>{toast.msg}</div>}
  </>);
}

function App(){
  const [config,setConfig]=useState(()=>{try{const s=localStorage.getItem("sb_cfg");return s?JSON.parse(s):null}catch{return null}});
  const save=cfg=>{localStorage.setItem("sb_cfg",JSON.stringify(cfg));setConfig(cfg)};
  const reset=()=>{if(window.confirm("¿Resetear configuración?")){ localStorage.removeItem("sb_cfg");setConfig(null)}};
  if(!config)return <><style>{CSS}</style><SetupScreen onSave={save}/></>;
  return <MainApp config={config} onReset={reset}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
